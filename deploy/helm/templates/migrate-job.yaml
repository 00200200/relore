#------------------------------------------------------------------------------
# `ghlored migrate`, as a Helm hook that runs before the workloads on every
# install and upgrade.
#
# It is a hook rather than an init container on each workload because the schema
# is one thing and there are three consumers: two init containers racing to apply
# migration 5 is a deadlock waiting for a slow day. `migrate` is idempotent
# (`applied_versions` skips what is recorded), so re-running it costs one query.
#
# `before-hook-creation` deletes the previous Job first: a Job's pod template is
# immutable, so a second upgrade would otherwise fail on a field nobody changed.
#------------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "name" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels: {{ include "labels.standard" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "labels.standard" . | nindent 8 }}
        component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          # The database may still be starting on a first install, so wait for it
          # rather than failing the release on a race with the StatefulSet.
          args:
            - |
              until pg_isready -h {{ include "name" . }}-postgres -U {{ .Values.postgres.user }} >/dev/null 2>&1; do
                echo "waiting for postgres"; sleep 3
              done
              exec ghlored migrate
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: GHLORE_DATABASE_URL
              value: {{ include "ghlore.databaseUrl" . | quote }}
          resources: {{ toYaml .Values.migrate.resources | nindent 12 }}
